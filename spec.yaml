# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Cloudflare DNS
description: A mixin for managing Cloudflare DNS records.
sourceUrl: https://github.com/mikesir87/sbx-kit-cloudflare-dns
licenses:
  - Apache-2.0

args:
  hostnames:
    description: A comma-separated list of hostnames to manage in Cloudflare DNS. Can include wildcards (e.g., *.example.com).
    required: true

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - api.cloudflare.com

  - type: com.docker.sandbox/credential@1
    description: Cloudflare API token with DNS read/edit permissions
    config:
      service: cloudflare-api
      phase: runtime
      apiKey:
        name: CLOUDFLARE_API_TOKEN
        proxyManaged: true
        inject:
          - {domain: api.cloudflare.com, header: Authorization, format: "Bearer %s"}

  - type: com.docker.sandbox/agent-skill@1
    config:
      path: /usr/share/cloudflare-dns-skill/cloudflare-dns
